spring:
  application:
    name: rag-report-analyzer
  datasource:
    url: jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring AI — provider selection via AI_PROVIDER env var
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: claude-sonnet-4-6
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text

server:
  port: 8080

ai:
  provider:
    # Active LLM provider: openai | anthropic | ollama
    active: ${AI_PROVIDER:openai}

app:
  # Vector store: simple | chroma (env: VECTORSTORE_TYPE)
  # - simple: in-memory, zero setup, resets on restart (default for local dev)
  # - chroma: ChromaDB via Docker, persistent, native metadata filters
  vectorstore:
    type: ${VECTORSTORE_TYPE:simple}

  # ChromaDB connection — only used when VECTORSTORE_TYPE=chroma.
  # ChromaApi bean is created lazily (ConditionalOnProperty), so these env vars
  # are only required when running with Docker Compose (CHROMA_HOST=chroma, CHROMA_PORT=8000).
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8000}

  # Prediction mode
  prediction:
    mode: ${PREDICTION_MODE:NARRATIVE_PREDICTION}

  # Phase 1 demo runner config (active with --spring.profiles.active=demo)
  demo:
    pdf-path: ${SAMPLE_PDF_PATH:../tmp/NVIDIA-2025-Annual-Report.pdf}
    ticker: ${DEMO_TICKER:NVDA}
    year: ${DEMO_YEAR:2025}
    quarter: ${DEMO_QUARTER:Annual}

management:
  endpoints:
    web:
      exposure:
        # Expose health, info, Prometheus scrape endpoint, metrics browser, cache stats
        include: "health,info,prometheus,metrics,caches"
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.aiarchitect.rag: INFO
    org.springframework.ai: INFO
