spring:
  application:
    name: rag-report-analyzer
  datasource:
    url: jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring AI — provider selection via LLM_PROVIDER env var
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: claude-sonnet-4-6
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text

server:
  port: 8080

ai:
  provider:
    # Active LLM provider: openai | anthropic | ollama
    active: ${AI_PROVIDER:openai}

app:
  # Vector store: simple | chroma
  vectorstore:
    type: ${VECTORSTORE_TYPE:simple}

  # Prediction mode
  prediction:
    mode: ${PREDICTION_MODE:NARRATIVE_PREDICTION}

  # Phase 1 demo runner config (active with --spring.profiles.active=demo)
  demo:
    pdf-path: ${SAMPLE_PDF_PATH:../tmp/NVIDIA-2025-Annual-Report.pdf}
    ticker: ${DEMO_TICKER:NVDA}
    year: ${DEMO_YEAR:2025}
    quarter: ${DEMO_QUARTER:Annual}

logging:
  level:
    com.aiarchitect.rag: INFO
    org.springframework.ai: INFO
