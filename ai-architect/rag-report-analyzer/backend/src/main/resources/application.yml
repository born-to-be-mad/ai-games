spring:
  application:
    name: rag-report-analyzer
  datasource:
    url: jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring AI — provider selection via AI_PROVIDER env var
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: claude-sonnet-4-6
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
          num-predict: -1  # unlimited output tokens; prevents JSON truncation
      embedding:
        options:
          model: nomic-embed-text

    # Spring AI observations (Layer 4) — emits spans + metrics for ChatClient / VectorStore / Embedding
    # Enabled automatically when Micrometer is on the classpath.
    # Set include-input/include-output=true only if prompts are non-sensitive (PII risk).
    chat:
      client:
        observations:
          include-input: false
          include-output: false
    vectorstore:
      observations:
        include-query-response: false
    embedding:
      observations:
        include-input: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

ai:
  provider:
    # Active LLM provider: openai | anthropic | ollama
    active: ${AI_PROVIDER:openai}

app:
  # Vector store: simple | chroma (env: VECTORSTORE_TYPE)
  # - simple: in-memory, zero setup, resets on restart (default for local dev)
  # - chroma: ChromaDB via Docker, persistent, native metadata filters
  vectorstore:
    type: ${VECTORSTORE_TYPE:simple}

  # ChromaDB connection — only used when VECTORSTORE_TYPE=chroma.
  # ChromaApi bean is created lazily (ConditionalOnProperty), so these env vars
  # are only required when running with Docker Compose (CHROMA_HOST=chroma, CHROMA_PORT=8000).
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8000}

  # Prediction mode
  prediction:
    mode: ${PREDICTION_MODE:NARRATIVE_PREDICTION}

  # Startup ingestion — set run-on-start=true (env: INGEST_ON_START=true)
  # to auto-ingest the sample PDF when the application starts. Disabled by default;
  # reports can always be uploaded via POST /api/v1/ingest.
  ingestion:
    run-on-start: ${INGEST_ON_START:false}
    pdf-path: ${SAMPLE_PDF_PATH:../tmp/NVIDIA-2025-Annual-Report.pdf}
    ticker: ${INGEST_TICKER:NVDA}
    year: ${INGEST_YEAR:2025}
    quarter: ${INGEST_QUARTER:Annual}

management:
  endpoints:
    web:
      exposure:
        # Expose health, info, Prometheus scrape endpoint, metrics browser, cache stats
        include: "health,info,prometheus,metrics,caches"
  metrics:
    export:
      prometheus:
        enabled: true
    # Tag every metric with the service name — visible in Grafana as a label
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: when-authorized

  # Distributed tracing (Layer 2) — Micrometer Tracing + OTel OTLP → Grafana Tempo
  tracing:
    sampling:
      # 100 % in dev; override via TRACING_SAMPLING_PROBABILITY env var in prod (e.g. 0.1)
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # OTLP gRPC endpoint — point to Grafana Tempo (default) or any OTel Collector
      endpoint: ${OTLP_ENDPOINT:http://tempo:4317}

# Bridge LOKI_URL env var to Spring property so logback-spring.xml can read it via springProperty
loki:
  url: ${LOKI_URL:http://loki:3100}

logging:
  level:
    com.aiarchitect.rag: INFO
    org.springframework.ai: INFO
