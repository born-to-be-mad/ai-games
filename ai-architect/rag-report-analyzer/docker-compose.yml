services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - VECTORSTORE_TYPE=${VECTORSTORE_TYPE:-chroma}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - PREDICTION_MODE=${PREDICTION_MODE:-NARRATIVE_PREDICTION}
      # PostgreSQL — set SPRING_PROFILES_ACTIVE=postgres when running with --profile postgres
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      # Observability — active when --profile observability is used; ignored otherwise
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-http://tempo:4317}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - rag-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rag-network

  chroma:
    image: chromadb/chroma:0.6.3
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # PostgreSQL — production database replacing H2.
  # Activate with: docker compose --profile postgres up
  # Backend also needs SPRING_PROFILES_ACTIVE=postgres to switch datasource.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres
    networks:
      - rag-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - ollama
    networks:
      - rag-network

  # ── Observability stack (Layer 1–4) ──────────────────────────────────────
  # Activate with: docker compose --profile observability up
  # Grafana UI: http://localhost:3001  (admin / admin)

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    profiles:
      - observability
    networks:
      - rag-network

  tempo:
    image: grafana/tempo:2.5.0
    user: "0:0"
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC receiver
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    profiles:
      - observability
    networks:
      - rag-network

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    profiles:
      - observability
    networks:
      - rag-network

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    profiles:
      - observability
    networks:
      - rag-network

volumes:
  chroma-data:
  ollama-data:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:

networks:
  rag-network:
    driver: bridge
