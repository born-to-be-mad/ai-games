plugins {
    id 'org.springframework.boot' version '4.0.3'
    id 'java-library'
}

// This is a library module, not an application
bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    // Spring AI Model Providers — exposed as api so consumers (orchestrator-web) see ChatClient,
    // BeanOutputConverter, ToolCallback and other Spring AI types without re-declaring them
    api 'org.springframework.ai:spring-ai-starter-model-ollama'
    api 'org.springframework.ai:spring-ai-starter-model-openai'
    api 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // H2 Database
    runtimeOnly 'com.h2database:h2'

    // Utilities
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}
