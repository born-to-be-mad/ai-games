name: daily-context-weather

services:
  weather-mcp-openmeteo:
    build:
      context: ./docker/weather-mcp-openmeteo
    container_name: weather-mcp-openmeteo
    ports:
      - "8101:8080"
    restart: unless-stopped
    networks:
      - daily-context-network

  weather-mcp-weatherapi:
    build:
      context: ./docker/weather-mcp-weatherapi
    container_name: weather-mcp-weatherapi
    ports:
      - "8103:8080"
    environment:
      - WEATHERAPI_KEY=${WEATHERAPI_KEY:-}
    restart: unless-stopped
    networks:
      - daily-context-network

  weather-mcp-openweathermap:
    build:
      context: ./docker/weather-mcp-openweathermap
    container_name: weather-mcp-openweathermap
    ports:
      - "8104:8080"
    environment:
      - OPENWEATHERMAP_KEY=${OPENWEATHERMAP_KEY:-}
    restart: unless-stopped
    networks:
      - daily-context-network

networks:
  daily-context-network:
    name: daily-context-network
    driver: bridge
