plugins {
    id 'org.springframework.boot' version '4.0.3'
}

springBoot {
    mainClass = 'ai.architect.orchestrator.web.Application'
}

dependencies {
    // Dependency on orchestrator-core
    implementation project(':orchestrator-core')

    // Dependency on orchestrator-mcp (MCP client integration)
    implementation project(':orchestrator-mcp')

    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA (for @Transactional and access to JPA repositories from orchestrator-core)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Actuator + Prometheus metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Caching (Caffeine)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // AOP (enables @Retryable / @ConcurrencyLimit SB4 declarative resilience)
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // Rate limiting (Bucket4j core — starter is incompatible with SB4)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // PDF export (OpenPDF — plain Java, no SB autoconfiguration)
    implementation 'com.github.librepdf:openpdf:2.0.3'

    // MVC test slice (@WebMvcTest) — Spring Boot 4.0
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
