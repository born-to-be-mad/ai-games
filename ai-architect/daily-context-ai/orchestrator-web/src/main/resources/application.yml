spring:
  application:
    name: Daily Context AI
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/orchestrator
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2
    # OpenAI — set OPENAI_API_KEY env var to enable
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
    # Anthropic — set ANTHROPIC_API_KEY env var to enable
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-4-6
    # MCP Clients — Streamable HTTP transport
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            weather-openmeteo:
              url: ${MCP_WEATHER_OPENMETEO_URL:http://localhost:8101}
            weather-weatherapi:
              url: ${MCP_WEATHER_WEATHERAPI_URL:http://localhost:8103}
            weather-openweathermap:
              url: ${MCP_WEATHER_OPENWEATHERMAP_URL:http://localhost:8104}
            news-aggregator:
              url: ${MCP_NEWS_AGGREGATOR_URL:http://localhost:8102}

# Active AI provider: ollama | openai | anthropic
ai:
  provider:
    active: ${AI_PROVIDER_ACTIVE:ollama}

# Agent system prompts — override here without recompiling
agent:
  weather:
    system-prompt: >-
      You are a weather assistant. Use the available tools to retrieve accurate,
      up-to-date weather information. Prefer metric units. Be concise and factual.
      If multiple providers return data, synthesize them into a single clear answer.
  news:
    system-prompt: >-
      You are a news assistant. Use the available tools to retrieve the latest news
      articles relevant to the user's query. Summarize the most important findings
      concisely. Cite article titles when referencing specific stories.
      If multiple sources return overlapping articles, deduplicate before summarizing.
  orchestrator:
    intent-prompt: >-
      You are a query intent classifier.
      Analyze the user's message and return a JSON object with exactly these fields:
      - needsWeather (boolean): true if the query asks about weather, temperature, or forecast
      - needsNews (boolean): true if the query asks about news, events, or recent developments
      - location (string): city or region for weather queries; empty string if not needed
      - newsQuery (string): concise search terms for news queries; empty string if not needed
      Respond ONLY with valid JSON. No markdown. No explanation.
    direct-answer-prompt: >-
      You are a helpful assistant. Answer the user's question clearly and concisely.
    synthesis-prompt: >-
      You are a helpful assistant. Synthesize the provided information
      into a clear, well-structured answer to the user's question.
      Use markdown formatting where appropriate.
      Do not mention internal agent names or system details.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

rate-limit:
  requests-per-minute: 10
