spring:
  application:
    name: Daily Context AI
  datasource:
    url: jdbc:h2:file:./data/orchestrator
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
    # OpenAI — set OPENAI_API_KEY env var to enable
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
    # Anthropic — set ANTHROPIC_API_KEY env var to enable
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-4-6
    # MCP Clients — Streamable HTTP transport
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            weather-openmeteo:
              url: http://localhost:8101
            weather-weatherapi:
              url: http://localhost:8103
            weather-openweathermap:
              url: http://localhost:8104
            news-aggregator:
              url: http://localhost:8102

# Active AI provider: ollama | openai | anthropic
ai:
  provider:
    active: ollama

server:
  port: 8080
