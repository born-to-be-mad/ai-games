spring:
  application:
    name: Daily Context AI
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/orchestrator
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
    # OpenAI — set OPENAI_API_KEY env var to enable
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
    # Anthropic — set ANTHROPIC_API_KEY env var to enable
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-4-6
    # MCP Clients — Streamable HTTP transport
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            weather-openmeteo:
              url: http://localhost:8101
            weather-weatherapi:
              url: http://localhost:8103
            weather-openweathermap:
              url: http://localhost:8104
            news-aggregator:
              url: http://localhost:8102

# Active AI provider: ollama | openai | anthropic
ai:
  provider:
    active: ollama

# Agent system prompts — override here without recompiling
agent:
  weather:
    system-prompt: >-
      You are a weather assistant. Use the available tools to retrieve accurate,
      up-to-date weather information. Prefer metric units. Be concise and factual.
      If multiple providers return data, synthesize them into a single clear answer.
  news:
    system-prompt: >-
      You are a news assistant. Use the available tools to retrieve the latest news
      articles relevant to the user's query. Summarize the most important findings
      concisely. Cite article titles when referencing specific stories.
      If multiple sources return overlapping articles, deduplicate before summarizing.

server:
  port: 8080
