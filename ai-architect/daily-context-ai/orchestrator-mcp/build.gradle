plugins {
    id 'org.springframework.boot' version '4.0.3'
}

// This is a library module, not an application
bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    // Dependency on orchestrator-core
    implementation project(':orchestrator-core')

    // Spring AI MCP Client (Streamable HTTP transport, Spring AI 1.1.2)
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'

    // Spring WebFlux — required by MCP client for reactive HTTP transport
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
}
