services:
  terra-ui:
    build:
      context: terra-ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - terra-infrastructure
    networks:
      - terra-network

  terra-infrastructure:
    build:
      context: .
      dockerfile: terra-infrastructure/Dockerfile
    ports:
      - "8080:8080"
    environment:
      TERRA_QUERY_AI_PROVIDER: ${TERRA_QUERY_AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SPRING_AI_MCP_CLIENT_TRANSPORT_STREAMABLE_HTTP_CONNECTIONS_TERRA_MCP_URL: http://terra-mcp:8080/mcp
    depends_on:
      terra-mcp:
        condition: service_healthy
    networks:
      - terra-network

  terra-mcp:
    build:
      context: terra-mcp
    ports:
      - "8200:8080"
    volumes:
      - terra-indices:/data/indices
      - terra-data:/app/data
    environment:
      MCP_TRANSPORT: streamable-http
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      INDEX_CACHE_DIR: /data/indices
      DATA_DIR: /app/data
      RRF_K: ${RRF_K:-60}
      RRF_BM25_WEIGHT: ${RRF_BM25_WEIGHT:-1.0}
      RRF_VECTOR_WEIGHT: ${RRF_VECTOR_WEIGHT:-1.0}
    deploy:
      resources:
        limits:
          # Set based on memory_profile.py output — default is conservative
          # Run: python terra-mcp/scripts/memory_profile.py to tune
          memory: 4g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',8080)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - terra-network

volumes:
  terra-indices:
    driver: local
  terra-data:
    driver: local

networks:
  terra-network:
    name: terra-query-network
