server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Defer upstream DNS to request time so nginx can start (and pass healthchecks) even if
    # Docker DNS has not yet registered terra-infrastructure when the container boots.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $terra_backend http://terra-infrastructure:8080;

    # Proxy API calls to backend
    location /api/ {
        proxy_pass $terra_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE — disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
