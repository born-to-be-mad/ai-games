name: terra-query - Performance Tests

on:
  schedule:
    # Every Monday at 06:00 UTC — catches regressions before the week starts
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation class to run"
        required: false
        default: "com.aiarchitect.terraquery.TerraQueryBaselineSimulation"
        type: choice
        options:
          - com.aiarchitect.terraquery.TerraQueryBaselineSimulation
          - com.aiarchitect.terraquery.TerraQuerySpikeSimulation
      users:
        description: "Number of concurrent users (baseline sim only)"
        required: false
        default: "10"
      duration:
        description: "Test duration in seconds (baseline sim only)"
        required: false
        default: "60"

defaults:
  run:
    working-directory: ai-architect/terra-query

jobs:
  gatling:
    name: Gatling — ${{ github.event.inputs.simulation || 'TerraQueryBaselineSimulation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Check required API keys
        id: check-secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=()
          [[ -z "$OPENAI_API_KEY" ]] && missing+=("OPENAI_API_KEY")
          [[ -z "$ANTHROPIC_API_KEY" ]] && missing+=("ANTHROPIC_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing required secrets: ${missing[*]}. Perf test requires a running LLM-backed service — will be skipped."
            echo "has_keys=false" >> $GITHUB_OUTPUT
          else
            echo "has_keys=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start full stack
        if: steps.check-secrets.outputs.has_keys == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TERRA_QUERY_AI_PROVIDER: openai
        run: docker compose up -d terra-mcp terra-infrastructure

      - name: Wait for terra-infrastructure healthy
        if: steps.check-secrets.outputs.has_keys == 'true'
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -sf http://localhost:8080/actuator/health \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            [ "$STATUS" = "UP" ] && echo "Backend ready" && break
            echo "Waiting for backend ($i/30)..."
            sleep 10
          done

      - name: Run Gatling simulation
        if: steps.check-secrets.outputs.has_keys == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GATLING_USERS: ${{ inputs.users || '10' }}
          GATLING_DURATION: ${{ inputs.duration || '60' }}
        run: |
          SIMULATION="${{ github.event.inputs.simulation || 'com.aiarchitect.terraquery.TerraQueryBaselineSimulation' }}"
          ./gradlew :terra-infrastructure:gatlingRun \
            --simulation "$SIMULATION" \
            -DTERRA_QUERY_BASE_URL=http://localhost:8080 \
            --no-daemon

      - name: Publish results to Job Summary
        if: always()
        run: |
          REPORT_DIR=$(ls -td terra-infrastructure/build/reports/gatling/*/ 2>/dev/null | head -1)
          if [ -d "$REPORT_DIR" ]; then
            STATS="$REPORT_DIR/js/stats.json"
            echo "## Gatling Results" >> $GITHUB_STEP_SUMMARY
            echo "**Simulation:** \`${{ github.event.inputs.simulation || 'TerraQueryBaselineSimulation' }}\`" >> $GITHUB_STEP_SUMMARY
            if [ -f "$STATS" ]; then
              python3 -c "
          import json
          with open('$STATS') as f: d = json.load(f)
          root = d.get('stats', {})
          ok  = root.get('numberOfRequests', {}).get('ok', 0)
          ko  = root.get('numberOfRequests', {}).get('ko', 0)
          p95 = root.get('percentiles3', {}).get('total', '—')
          p50 = root.get('percentiles2', {}).get('total', '—')
          print(f'| Metric | Value |')
          print(f'|---|---|')
          print(f'| Requests OK | {ok} |')
          print(f'| Requests KO | {ko} |')
          print(f'| p50 (ms) | {p50} |')
          print(f'| p95 (ms) | {p95} |')
          " >> $GITHUB_STEP_SUMMARY || true
            fi
          fi

      - name: Upload Gatling HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report-${{ github.run_number }}
          path: ai-architect/terra-query/terra-infrastructure/build/reports/gatling/

      - name: Tear down stack
        if: always()
        run: docker compose down
