name: terra-query - Java Mutation Tests

on:
  schedule:
    - cron: "0 3 * * *"   # Nightly at 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "ai-architect/terra-query/terra-core/**"

defaults:
  run:
    working-directory: ai-architect/terra-query

jobs:
  pitest:
    name: PIT Mutation Tests (terra-core ≥70%)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run PIT — terra-core (target ≥70% kill)
        run: ./gradlew :terra-core:pitest

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports-${{ github.run_number }}
          path: |
            ai-architect/terra-query/terra-core/build/reports/pitest/
