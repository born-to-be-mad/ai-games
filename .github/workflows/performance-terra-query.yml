name: Performance — terra-query (Weekly Baseline)

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'TerraQuery base URL (default: http://localhost:8080 via docker-compose)'
        required: false
        default: 'http://localhost:8080'
      simulation:
        description: 'Simulation class to run'
        required: false
        default: 'com.aiarchitect.terraquery.TerraQueryBaselineSimulation'
        type: choice
        options:
          - com.aiarchitect.terraquery.TerraQueryBaselineSimulation
          - com.aiarchitect.terraquery.TerraQuerySpikeSimulation

defaults:
  run:
    working-directory: ai-architect/terra-query

jobs:
  gatling:
    name: Gatling Performance Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start full stack via docker-compose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TERRA_QUERY_AI_PROVIDER: openai
        run: docker compose up -d --build

      - name: Wait for terra-infrastructure healthy
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sf http://localhost:8080/actuator/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "UP" ]; then
              echo "terra-infrastructure is UP"
              break
            fi
            echo "  attempt $i/40 — status='$STATUS'"
            sleep 10
          done

      - name: Run Gatling simulation
        run: |
          SIMULATION="${{ github.event.inputs.simulation || 'com.aiarchitect.terraquery.TerraQueryBaselineSimulation' }}"
          BASE_URL="${{ github.event.inputs.base_url || 'http://localhost:8080' }}"
          ./gradlew :terra-infrastructure:gatlingRun \
            --simulation "$SIMULATION" \
            -DTERRA_QUERY_BASE_URL="$BASE_URL" \
            --no-daemon

      - name: Publish Gatling summary to Job Summary
        if: always()
        run: |
          REPORT_DIR=$(ls -td terra-infrastructure/build/reports/gatling/*/ | head -1)
          if [ -d "$REPORT_DIR" ]; then
            echo "## Gatling Results" >> $GITHUB_STEP_SUMMARY
            echo "Simulation: \`${{ github.event.inputs.simulation || 'TerraQueryBaselineSimulation' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "Report: $REPORT_DIR" >> $GITHUB_STEP_SUMMARY
            # Extract key stats from stats.json if present
            STATS="$REPORT_DIR/js/stats.json"
            if [ -f "$STATS" ]; then
              python3 -c "
          import json
          with open('$STATS') as f: d = json.load(f)
          root = d.get('stats', {})
          ok = root.get('numberOfRequests', {}).get('ok', 0)
          ko = root.get('numberOfRequests', {}).get('ko', 0)
          p95 = root.get('percentiles3', {}).get('total', '—')
          print(f'| Requests OK | {ok} |')
          print(f'| Requests KO | {ko} |')
          print(f'| p95 (ms)    | {p95} |')
          " >> $GITHUB_STEP_SUMMARY || true
            fi
          fi

      - name: Upload Gatling HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report-${{ github.run_number }}
          path: ai-architect/terra-query/terra-infrastructure/build/reports/gatling/

      - name: Tear down stack
        if: always()
        run: docker compose down -v
