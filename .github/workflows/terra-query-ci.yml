name: terra-query - CI

on:
  push:
    branches:
      - main
    paths:
      - "ai-architect/terra-query/**"
  pull_request:
    branches: [ main ]
    paths:
      - "ai-architect/terra-query/**"

defaults:
  run:
    working-directory: ai-architect/terra-query

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build terra-core (domain, zero Spring)
        run: ./gradlew :terra-core:build

      - name: Run terra-core unit tests (target ≥90% coverage)
        run: ./gradlew :terra-core:test --info

      - name: Run terra-infrastructure unit + integration tests (includes ArchUnit)
        run: ./gradlew :terra-infrastructure:test --info

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            ai-architect/terra-query/terra-core/build/reports/tests/
            ai-architect/terra-query/terra-infrastructure/build/reports/tests/

  ragas-canary:
    name: RAGAS Canary Eval (10 questions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    # Only run on PRs with real API keys available (skip on forks without secrets)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: ai-architect/terra-query/terra-mcp

    steps:
      - uses: actions/checkout@v6

      - name: Check required API keys
        id: check-secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=()
          [[ -z "$OPENAI_API_KEY" ]] && missing+=("OPENAI_API_KEY")
          [[ -z "$ANTHROPIC_API_KEY" ]] && missing+=("ANTHROPIC_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing required secrets: ${missing[*]}. RAGAS canary eval will be skipped."
            echo "has_keys=false" >> $GITHUB_OUTPUT
          else
            echo "has_keys=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eval dependencies
        run: pip install -r requirements-eval.txt

      - name: Start terra-mcp server
        if: steps.check-secrets.outputs.has_keys == 'true'
        working-directory: ai-architect/terra-query
        run: docker compose up -d terra-mcp

      - name: Wait for terra-mcp healthy
        if: steps.check-secrets.outputs.has_keys == 'true'
        working-directory: ai-architect/terra-query
        run: |
          for i in $(seq 1 30); do
            python -c "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8200)); s.close(); print('MCP ready')" 2>/dev/null && break
            echo "Waiting ($i/30)..."
            sleep 10
          done

      - name: Run RAGAS canary eval (10 questions)
        if: steps.check-secrets.outputs.has_keys == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m eval.eval_runner --subset canary --output-file ragas-canary.json

      - name: Publish canary results to summary
        if: always()
        run: |
          if [ -f ragas-canary.json ]; then
            echo "## RAGAS Canary (10 Q)" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          with open('ragas-canary.json') as f: d = json.load(f)
          for m in d['metrics']:
              icon = '✅' if m['status'] == 'PASS' else ('⚠️' if m['status'] == 'WARN' else '❌')
              print(f\"{icon} **{m['name']}**: {m['score']:.3f}\")
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-canary-${{ github.run_number }}
          path: ai-architect/terra-query/terra-mcp/ragas-canary.json

      - name: Tear down MCP server
        if: always()
        working-directory: ai-architect/terra-query
        run: docker compose down

  mutation-tests:
    name: PIT Mutation Testing (terra-core, target ≥55% kill)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run PIT mutation tests (terra-core, target ≥55% kill)
        run: ./gradlew :terra-core:pitest

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report-${{ github.run_number }}
          path: ai-architect/terra-query/terra-core/build/reports/pitest/
