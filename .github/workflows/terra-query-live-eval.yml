name: terra-query: Live LLM Eval

on:
  schedule:
    - cron: "0 4 * * 0"   # Every Sunday at 04:00 UTC
  workflow_dispatch:
    inputs:
      question_subset:
        description: "Run full golden dataset or canary subset"
        required: false
        default: "canary"
        type: choice
        options:
          - full
          - canary

defaults:
  run:
    working-directory: ai-architect/terra-query

jobs:
  live-llm-tests:
    name: Live LLM Answer Quality Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Check required API keys
        id: check-secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=()
          [[ -z "$OPENAI_API_KEY" ]] && missing+=("OPENAI_API_KEY")
          [[ -z "$ANTHROPIC_API_KEY" ]] && missing+=("ANTHROPIC_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing required secrets: ${missing[*]}. Live LLM eval will be skipped."
            echo "has_keys=false" >> $GITHUB_OUTPUT
          else
            echo "has_keys=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start terra-mcp server with real data
        if: steps.check-secrets.outputs.has_keys == 'true'
        run: docker compose up -d terra-mcp

      - name: Wait for terra-mcp healthy
        if: steps.check-secrets.outputs.has_keys == 'true'
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/health && echo "MCP server ready" && break
            echo "Waiting for MCP server ($i/30)..."
            sleep 10
          done

      - name: Run live LLM answer quality tests
        if: steps.check-secrets.outputs.has_keys == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ./gradlew :terra-infrastructure:liveTest \
            -Psubset=${{ github.event.inputs.question_subset || 'canary' }}

      - name: Upload live LLM evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-llm-report-${{ github.run_number }}
          path: ai-architect/terra-query/terra-infrastructure/build/reports/live-llm/

      - name: Tear down MCP server
        if: always()
        run: docker compose down
