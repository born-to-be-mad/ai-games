name: terra-query - Python Mutation Tests

on:
  schedule:
    - cron: "0 2 * * *"   # Nightly at 02:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "ai-architect/terra-query/terra-mcp/**"

defaults:
  run:
    working-directory: ai-architect/terra-query/terra-mcp

jobs:
  mutmut:
    name: mutmut — terra-mcp (kill rate ≥ 65%)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests baseline (must pass before mutation)
        run: python -m pytest tests/unit/ -q --tb=short

      - name: Run mutmut
        # mutmut exits non-zero when mutants survive — capture for threshold check
        run: mutmut run || true

      - name: Export mutmut results to JSON
        run: |
          mutmut results --json > mutmut-results.json 2>/dev/null || \
            python -c "
          import subprocess, json, sys
          out = subprocess.run(['mutmut', 'results'], capture_output=True, text=True)
          lines = out.stdout.strip().splitlines()
          killed = sum(1 for l in lines if 'killed' in l.lower())
          survived = sum(1 for l in lines if 'survived' in l.lower())
          total = killed + survived
          rate = killed / total if total else 0.0
          print(json.dumps({'killed': killed, 'survived': survived, 'total': total, 'kill_rate': rate}))
          " > mutmut-results.json

      - name: Enforce ≥ 65% kill rate
        run: |
          python - <<'EOF'
          import json, sys

          with open("mutmut-results.json") as f:
              data = json.load(f)

          kill_rate = data.get("kill_rate", 0.0)
          killed    = data.get("killed", 0)
          survived  = data.get("survived", 0)
          total     = data.get("total", 0)

          print(f"Mutation results: {killed}/{total} killed ({kill_rate:.1%})")

          THRESHOLD = 0.65
          if kill_rate < THRESHOLD:
              print(f"::error::Kill rate {kill_rate:.1%} is below threshold {THRESHOLD:.0%}. "
                    f"{survived} mutants survived — see artifact for details.")
              sys.exit(1)

          print(f"::notice::Kill rate {kill_rate:.1%} meets threshold ≥{THRESHOLD:.0%}. ✓")
          EOF

      - name: Publish summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os

          results_file = "mutmut-results.json"
          if not os.path.exists(results_file):
              print("No results file found.")
              exit()

          with open(results_file) as f:
              data = json.load(f)

          kill_rate = data.get("kill_rate", 0.0)
          killed    = data.get("killed", 0)
          survived  = data.get("survived", 0)
          total     = data.get("total", 0)
          status    = "✅ PASS" if kill_rate >= 0.65 else "❌ FAIL"

          summary = f"""## Python Mutation Tests — terra-mcp

          | Metric | Value |
          |--------|-------|
          | Total mutants | {total} |
          | Killed | {killed} |
          | Survived | {survived} |
          | Kill rate | {kill_rate:.1%} |
          | Target | ≥ 65% |
          | Status | {status} |
          """

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      - name: Upload mutmut results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results-${{ github.run_number }}
          path: ai-architect/terra-query/terra-mcp/mutmut-results.json
