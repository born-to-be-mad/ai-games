name: CI — daily-context-ai

on:
  push:
    branches: [main]
    paths:
      - 'ai-architect/daily-context-ai/**'
      - '.github/workflows/ci-daily-context-ai.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-architect/daily-context-ai/**'
      - '.github/workflows/ci-daily-context-ai.yml'

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-architect/daily-context-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daily-context-ai-test-reports
          path: ai-architect/daily-context-ai/**/build/reports/tests/

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-architect/daily-context-ai/orchestrator-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-architect/daily-context-ai/orchestrator-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
